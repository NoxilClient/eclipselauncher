name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      # La chiave arriva in base64 (una sola riga): cosi' newline, spazi o "="
      # aggiunti dal copia-incolla non rompono piu' la firma.
      - name: Restore signing key
        env:
          KEY_B64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          mkdir -p "$HOME/.tauri"
          if [ -n "${KEY_B64:-}" ]; then
            printf '%s' "$KEY_B64" | tr -d ' \r\n' | base64 -d > "$HOME/.tauri/divine.key"
            echo "chiave ripristinata: $(wc -c < "$HOME/.tauri/divine.key") byte"
          else
            echo "TAURI_SIGNING_PRIVATE_KEY_B64 assente: uso il secret testuale"
          fi
      # GitHub releases (linuxdeploy/AppRun) rispondono ogni tanto 504: li scarico
      # prima, con retry, cosi' il bundler li trova gia' in cache.
      - name: Pre-cache AppImage tooling
        continue-on-error: true
        run: |
          mkdir -p "$HOME/.cache/tauri"
          fetch() {
            name="$1"; url="$2"
            for i in 1 2 3 4 5; do
              if curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 300 \
                   -o "$HOME/.cache/tauri/$name" "$url"; then
                echo "ok: $name"
                return 0
              fi
              echo "retry $i: $name"
              sleep 10
            done
            echo "non scaricato: $name (il bundler riprovera' da solo)"
            return 1
          }
          fetch AppRun-x86_64 \
            "https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64" || true
          fetch linuxdeploy-07333c6-x86_64.AppImage \
            "https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy-07333c6/linuxdeploy-x86_64.AppImage" || true
          chmod +x "$HOME/.cache/tauri"/*.AppImage 2>/dev/null || true
          ls -l "$HOME/.cache/tauri" || true
      - uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_B64 != '' && '/home/runner/.tauri/divine.key' || secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: eclipse_tauri/src-tauri
          args: --bundles appimage,deb
          tagName: v__VERSION__
          releaseName: "DivineClient v__VERSION__"
          releaseBody: "Build automatica firmata da GitHub Actions."
          includeUpdaterJson: true
