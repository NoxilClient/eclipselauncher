[package]
name = "divine-client"
version = "0.3.7"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
futures-util = "0.3.34"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
zip = "2.6.1"
sha1 = "0.10.7"
dirs = "7.0.0"
md-5 = "0.10"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
